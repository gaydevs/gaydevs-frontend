name: "👥 Entrar no gdevs-team 🌈"
description: "Peça acesso ao time de colaboradores do @gay.devs"
title: "[team] quero entrar no gdevs-team"

body:
  - type: markdown
    attributes:
      value: |
        ## 👋 bora colaborar?

        antes de enviar, confira se vc está logado no GitHub com a conta que quer adicionar ao `gdevs-team`.

  - type: checkboxes
    id: community
    attributes:
      label: "confirmação"
      options:
        - label: "sou membro do @gay.devs"
          required: true

  - type: checkboxes
    id: interests
    attributes:
      label: "quero colaborar com"
      description: "marque o que fizer sentido"
      options:
        - label: "código"
        - label: "design"
        - label: "conteúdo"
        - label: "testes"
        - label: "documentação"
        - label: "ideias / outros"

  - type: textarea
    id: notes
    attributes:
      label: "algo mais?"
      description: "opcional"
      placeholder: "se quiser, conta rapidamente como pretende colaborar"