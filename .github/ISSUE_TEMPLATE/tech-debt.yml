name: "Tech Debt"
description: "Problema técnico acumulado"
type: "Tech Debt"
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto e problema
      value: '<!-- gaydevs-sdd:Tech Debt -->'
      description: Descreva o problema e preserve o marcador acima para rastreabilidade.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado esperado
      description: Descreva comportamento e escopo. Para Bug, inclua reprodução, resultado atual e ambiente.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Como um gdev verificará a conclusão?
    validations:
      required: true
  - type: markdown
    attributes:
      value: 'Após criar, defina Priority (High, Medium ou Low) no campo nativo. Use blocked by / blocking para dependências. Feature sempre exige spec; demais tipos podem ser triviais.'
